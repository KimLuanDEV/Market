<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng bán sản phẩm</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#07111f,#101827);
  color:white;
}

.page{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding:18px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:#1e293b;
  color:white;
  font-size:20px;
}

.title{
  font-size:22px;
  font-weight:900;
}

.card{
  background:linear-gradient(180deg,#172033,#0f172a);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:18px;
  box-shadow:0 18px 45px rgba(0,0,0,.45);
}

.input{
  width:100%;
  box-sizing:border-box;
  margin-bottom:14px;
  padding:15px;
  border:0;
  border-radius:16px;
  background:#020617;
  color:white;
  font-size:15px;
  outline:none;
}

textarea.input{
  min-height:100px;
  resize:none;
}

.btn{
  width:100%;
  height:54px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:900;
  font-size:16px;
  box-shadow:0 12px 25px rgba(34,197,94,.25);
}

.msg{
  margin-top:14px;
  text-align:center;
  color:#facc15;
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <button class="back" onclick="history.back()">←</button>
    <div class="title">Đăng bán</div>
    <div style="width:42px"></div>
  </div>

  <div class="card">
    <input id="name" class="input" placeholder="Tên sản phẩm">

    <input id="price" class="input" type="number" placeholder="Giá bán">

    <input id="image" class="input" placeholder="Link ảnh sản phẩm">

    <input id="category" class="input" placeholder="Danh mục">

    <textarea id="description" class="input" placeholder="Mô tả sản phẩm"></textarea>

    <button class="btn" onclick="createProduct()">ĐĂNG BÁN NGAY</button>

    <div id="msg" class="msg"></div>
  </div>

</div>

<script>
const uid = localStorage.getItem("uid");

function showMsg(t){
  const msg = document.getElementById("msg");

  if(!msg){
    alert(t);
    return;
  }

  msg.textContent = t;
}

async function createProduct(){

  /*  
  if(!uid){
    showMsg("❌ Bạn cần đăng nhập để đăng bán");
    return;
  }
*/

  const body = {
    name: document.getElementById("name").value.trim(),
    price: Number(document.getElementById("price").value),
    image: document.getElementById("image").value.trim(),
    category: document.getElementById("category").value.trim(),
    description: document.getElementById("description").value.trim()
  };

  if(!body.name || !body.price){
    showMsg("❌ Nhập tên và giá sản phẩm");
    return;
  }

  const res = await fetch("/api/products", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      uid
    },
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if(data.error){
    showMsg("❌ " + data.error);
    return;
  }

  showMsg("✅ Đăng bán thành công");

  setTimeout(() => {
    location.href = "/market.html";
  }, 800);
}
</script>

</body>
</html>
