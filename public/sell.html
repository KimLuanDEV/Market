<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng bán</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="form-box">
  <h2>Đăng sản phẩm</h2>

  <input id="name" placeholder="Tên sản phẩm">
  <input id="price" type="number" placeholder="Giá kim cương">
  <input id="stock" type="number" placeholder="Số lượng">
  <input id="image" placeholder="Link ảnh sản phẩm">
  <textarea id="description" placeholder="Mô tả sản phẩm"></textarea>

  <button onclick="createProduct()">Đăng bán</button>
</div>

<script>
const uid = localStorage.getItem("uid");

function showMsg(t){

  const msgEl = document.getElementById("msg");

  if(!msgEl) return;

  msgEl.textContent = t;
}

async function createProduct(){
  if(!uid){
    showMsg("❌ Bạn cần đăng nhập để đăng bán");
    return;
  }

  const nameEl = document.getElementById("name");
  const priceEl = document.getElementById("price");
  const imageEl = document.getElementById("image");
  const categoryEl = document.getElementById("category");
  const descriptionEl = document.getElementById("description");

  const body = {
    name: nameEl.value.trim(),
    price: Number(priceEl.value || 0),
    image: imageEl.value.trim(),
    category: categoryEl.value.trim(),
    description: descriptionEl.value.trim()
  };

  if(!body.name || body.price <= 0){
    showMsg("❌ Nhập tên và giá sản phẩm hợp lệ");
    return;
  }

  const res = await fetch("/api/product/create", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      uid
    },
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if(data.error){
    showMsg("❌ " + data.error);
    return;
  }

  showMsg("✅ Đăng bán thành công");

  setTimeout(() => {
    location.href = "/market.html";
  }, 800);
}
</script>

</body>
</html>
